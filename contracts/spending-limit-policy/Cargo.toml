[package]
name = "contexta-spending-limit-policy"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Reusable OpenZeppelin spending-limit policy contract, deployed once and referenced by contexta-smart-treasury's context rule."

[lib]
